name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its previous, now outdated run. Runs
# on main each get their own group and go ahead at once: a run waiting on a
# failed deploy must not hold back the fix pushed after it. Running them side
# by side is safe, since the cluster deploys the highest chart version
# whatever order they finish in.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Check shell scripts
        # shellcheck comes preinstalled on GitHub's Ubuntu runners. The
        # server's setup script is a Terraform template: its ${...} values
        # are filled in by Terraform, so "never assigned" (SC2154) is moot.
        run: |
          shellcheck scripts/*.sh
          shellcheck -s sh -e SC2154 deploy/terraform/setup-node.sh.tftpl
      - name: Check the compose file
        run: docker compose config -q
      - name: Check the page script parses
        # Node comes preinstalled on GitHub's Ubuntu runners.
        run: node --check internal/web/static/app.js
      - name: Install Terraform
        # The version used locally, checked against the hash HashiCorp
        # publishes for it. Downloads retry on any error, since a CDN edge
        # can fail for a moment, as get.helm.sh's once did with a
        # certificate for another name; the hash still guards the file.
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/terraform.zip" https://releases.hashicorp.com/terraform/1.16.6/terraform_1.16.6_linux_amd64.zip
          echo "38034b38d03096399a7a1264a14561a8029b2b496fd1f169452656e53968f1b7  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/terraform.zip" terraform -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check the Terraform
        # No credentials here: validate checks the configuration without
        # contacting Oracle. Terraform runs against the cloud from a laptop
        # only.
        working-directory: deploy/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Install Helm
        # The version used locally, checked against its published hash, and
        # retried like Terraform's.
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/helm.tar.gz" https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
          echo "0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check the Helm chart
        # Flux runs every release through kustomize, which, unlike Helm,
        # rejects a key given twice, so render it the same way. kubectl
        # comes with the runner.
        run: |
          helm lint --strict deploy/chart --set host=ci.example.sslip.io
          mkdir "$RUNNER_TEMP/chart"
          helm template apartment-finder deploy/chart --set host=ci.example.sslip.io > "$RUNNER_TEMP/chart/all.yaml"
          echo 'resources: [all.yaml]' > "$RUNNER_TEMP/chart/kustomization.yaml"
          kubectl kustomize "$RUNNER_TEMP/chart" > /dev/null
      - name: Check the chart's PostGIS image matches its Dockerfile
        # The image is tagged by a hash of its Dockerfile; a stale tag in the
        # chart would deploy the old database image.
        run: |
          want="pg18-$(sha256sum deploy/postgis/Dockerfile | cut -c1-12)"
          if ! grep -q "apartment-finder-postgis:$want\$" deploy/chart/values.yaml; then
            echo "deploy/chart/values.yaml must use apartment-finder-postgis:$want"
            exit 1
          fi

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install osmium for the amenity import tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - run: go test -race ./...
      - name: Check every line of the scoring package is tested
        # The score is what users see; untested scoring code fails the build.
        run: |
          go test -coverprofile=scoring.out ./internal/scoring
          go tool cover -func=scoring.out | tail -1
          go tool cover -func=scoring.out | tail -1 | grep -q '100.0%'

  image:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/msjawad
      # Pull requests only check that the images build; pushes to main publish them.
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up arm64 emulation
        # Go cross-compiles without it, but the importer and PostGIS images
        # run apt-get inside arm64 images.
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - name: Create a BuildKit builder
        # The default builder loads every image into the local Docker store;
        # a docker-container builder can build without loading or pushing.
        run: docker buildx create --use --driver docker-container
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the app and importer images
        # Both from the one Dockerfile, tagged with the commit.
        run: |
          for target in app importer; do
            name=apartment-finder
            [ "$target" = importer ] && name=apartment-finder-importer
            docker buildx build . \
              --target "$target" \
              --platform linux/arm64 \
              --build-arg VERSION="$GITHUB_SHA" \
              --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --tag "$REGISTRY/$name:$GITHUB_SHA" \
              --output type=image,push="$PUSH"
          done
      - name: Build the PostGIS image if it changed
        # Tagged by a hash of its Dockerfile, not the commit: an unchanged
        # database image keeps its tag, so deploys don't restart Postgres.
        run: |
          tag="pg18-$(sha256sum deploy/postgis/Dockerfile | cut -c1-12)"
          echo "PostGIS image tag: $tag"
          if [ "$PUSH" = true ] && docker buildx imagetools inspect "$REGISTRY/apartment-finder-postgis:$tag" >/dev/null 2>&1; then
            echo "Already published."
            exit 0
          fi
          docker buildx build deploy/postgis \
            --platform linux/arm64 \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$REGISTRY/apartment-finder-postgis:$tag" \
            --output type=image,push="$PUSH"
      - name: Publish the Helm chart
        # Version 0.1.<run number> rises with every build on main; the cluster
        # deploys the highest one. The commit, as appVersion, is the tag of
        # the app and importer images the chart runs.
        if: env.PUSH == 'true'
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/helm.tar.gz" https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
          echo "0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 linux-amd64/helm
          echo "$GITHUB_TOKEN" | "$RUNNER_TEMP/helm" registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          "$RUNNER_TEMP/helm" package deploy/chart --version "0.1.$GITHUB_RUN_NUMBER" --app-version "$GITHUB_SHA" --destination "$RUNNER_TEMP"
          "$RUNNER_TEMP/helm" push "$RUNNER_TEMP/apartment-finder-0.1.$GITHUB_RUN_NUMBER.tgz" oci://ghcr.io/msjawad/charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the registry has arm64 images
        if: env.PUSH == 'true'
        # Reads back what the registry actually stores. Attestations are listed
        # with platform unknown/unknown, so they are filtered out.
        run: |
          pg="pg18-$(sha256sum deploy/postgis/Dockerfile | cut -c1-12)"
          for image in "apartment-finder:$GITHUB_SHA" "apartment-finder-importer:$GITHUB_SHA" "apartment-finder-postgis:$pg"; do
            platforms=$(docker buildx imagetools inspect "$REGISTRY/$image" --format '{{json .Manifest}}' \
              | jq -r '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | unique | join(",")')
            echo "$image: $platforms"
            test "$platforms" = "linux/arm64"
          done

  deploy:
    # Flux deploys from inside the cluster, so CI holds no cluster
    # credentials. This job waits until the live site serves the commit, so a
    # rollout that fails, and is rolled back, fails CI with a clear message.
    needs: [image]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Wait for the site to serve this commit
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          deadline=$((SECONDS + 900))
          while :; do
            live=$(curl -sf --max-time 10 "$SITE_URL/api/version" | jq -r .version || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Live: $live"
              exit 0
            fi
            # A newer commit may already be live; it includes this one.
            if [ -n "$live" ] && git fetch -q origin main && git merge-base --is-ancestor "$GITHUB_SHA" "$live" 2>/dev/null; then
              echo "A newer commit is live: $live"
              exit 0
            fi
            if [ $SECONDS -ge $deadline ]; then
              echo "::error::After 15 minutes $SITE_URL still serves ${live:-nothing}, not $GITHUB_SHA. The rollout failed or is stuck: run 'flux get helmreleases -A' and check the pods."
              exit 1
            fi
            sleep 15
          done
