name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its previous, now outdated run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - name: Check every line of the scoring package is tested
        # The score is what users see; untested scoring code fails the build.
        run: |
          go test -coverprofile=scoring.out ./internal/scoring
          go tool cover -func=scoring.out | tail -1
          go tool cover -func=scoring.out | tail -1 | grep -q '100.0%'

  image:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/msjawad/apartment-finder
      # Pull requests only check that the image builds; pushes to main publish it.
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create a BuildKit builder
        # The default builder loads every image into the local Docker store;
        # a docker-container builder can build without loading or pushing.
        run: docker buildx create --use --driver docker-container
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the arm64 image
        run: >-
          docker buildx build .
          --platform linux/arm64
          --build-arg VERSION=${{ github.sha }}
          --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          --tag ${{ env.IMAGE }}:${{ github.sha }}
          --output type=image,push=${{ env.PUSH }}
      - name: Check the registry has an arm64 image
        if: env.PUSH == 'true'
        # Reads back what the registry actually stores. Attestations are listed
        # with platform unknown/unknown, so they are filtered out.
        run: |
          platforms=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | unique | join(",")')
          echo "Published platforms: $platforms"
          test "$platforms" = "linux/arm64"
